      <stop offset="0%" stop-color="#08090A"/>
      <stop offset="50%" stop-color="#12162C"/>
      <stop offset="100%" stop-color="#08090A"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#4EA7FC" stop-opacity="0.45"/>
