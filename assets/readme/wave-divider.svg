<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="1200" height="32" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5E6AD2" stop-opacity="0"/>
      <stop offset="25%" stop-color="#5E6AD2" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#4EA7FC" stop-opacity="1"/>
      <stop offset="75%" stop-color="#5E6AD2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#5E6AD2" stop-opacity="0"/>
    </linearGradient>
    <style>
      .flow {
        stroke-dasharray: 18 14;
        animation: dashMove 3.2s linear infinite;
      }
      @keyframes dashMove {
        from { stroke-dashoffset: 64; }
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>
  <path d="M 40 16 Q 160 4, 280 16 T 520 16 T 760 16 T 1000 16 T 1160 16" fill="none" stroke="url(#lineGrad)" stroke-width="2" opacity="0.35"/>
  <path class="flow" d="M 40 16 Q 160 28, 280 16 T 520 16 T 760 16 T 1000 16 T 1160 16" fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="600" cy="16" r="4" fill="#A9B4FF">
    <animate attributeName="r" values="3;5.5;3" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
