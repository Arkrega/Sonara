name: Upstream Sync

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream Repository
        run: |
          git remote add upstream https://github.com/MetrolistGroup/Metrolist.git || true
          git fetch upstream main

      - name: Check for New Upstream Commits
        id: check_upstream
        run: |
          AHEAD=$(git rev-list --count HEAD..upstream/main)
          echo "Commits behind upstream: $AHEAD"
          if [ "$AHEAD" -eq 0 ]; then
            echo "sync_needed=false" >> $GITHUB_OUTPUT
            echo "Fork is already up to date with upstream."
          else
            echo "sync_needed=true" >> $GITHUB_OUTPUT
            echo "commits_count=$AHEAD" >> $GITHUB_OUTPUT
          fi

      - name: Synchronize and Create Pull Request
        if: steps.check_upstream.outputs.sync_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SYNC_BRANCH="automation/upstream-sync"

          git checkout -B "$SYNC_BRANCH" origin/main

          echo "Attempting merge of upstream/main into $SYNC_BRANCH..."
          if git merge upstream/main -m "chore(sync): merge upstream changes from MetrolistGroup/Metrolist"; then
            echo "Merge succeeded without conflicts."
            git push origin "$SYNC_BRANCH" --force

            COMMITS_LOG=$(git log --oneline HEAD~${{ steps.check_upstream.outputs.commits_count }}..HEAD)

            PR_TITLE="chore(upstream): synchronize with MetrolistGroup/Metrolist"
            PR_BODY=$(cat <<EOF
          ## Automated Upstream Synchronization

          This pull request syncs the fork with the latest upstream changes from [MetrolistGroup/Metrolist](https://github.com/MetrolistGroup/Metrolist).

          ### Commits Included (${{ steps.check_upstream.outputs.commits_count }}):
          \`\`\`text
          $COMMITS_LOG
          \`\`\`

          > [!NOTE]
          > Android CI will automatically validate this pull request. Review changes carefully before merging.
          EOF
          )

            EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base main --json number --jq '.[0].number')
            if [ -n "$EXISTING_PR" ]; then
              echo "Updating existing PR #$EXISTING_PR"
              gh pr edit "$EXISTING_PR" --title "$PR_TITLE" --body "$PR_BODY"
            else
              echo "Creating new PR"
              gh pr create --base main --head "$SYNC_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
            fi
          else
            echo "::error::Merge conflict detected between upstream/main and fork main!"
            echo "Conflicted files:"
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi
