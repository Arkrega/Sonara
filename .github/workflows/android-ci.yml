name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test FOSS Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Build Sonara Native Core (Rust)
        run: |
          cargo test --manifest-path sonara-core/Cargo.toml
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)}"
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang" \
            CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384" \
            cargo build --manifest-path sonara-core/Cargo.toml --release --target aarch64-linux-android
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang" \
            cargo build --manifest-path sonara-core/Cargo.toml --release --target armv7-linux-androideabi
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          cp sonara-core/target/aarch64-linux-android/release/libsonara_core.so app/src/main/jniLibs/arm64-v8a/libsonara_core.so
          cp sonara-core/target/armv7-linux-androideabi/release/libsonara_core.so app/src/main/jniLibs/armeabi-v7a/libsonara_core.so

      - name: Setup Debug Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/persistent-debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build FOSS Debug APK & Run Tests
        run: ./gradlew --console=plain assembleFossDebug testFossDebugUnitTest --warning-mode summary

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonara-Debug
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 7
