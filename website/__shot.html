<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0}iframe{width:100%;height:1600px;border:0;display:block}</style></head><body>
<iframe id="f" src="/"></iframe>
<script>
const p = new URLSearchParams(location.search);
document.getElementById('f').onload = function(){
  const d = this.contentDocument, f = this;
  if (p.get('drawer')) d.getElementById('nav-toggle').click();
  if (p.get('scroll')) f.style.marginTop = '-' + p.get('scroll') + 'px';
};
</script></body></html>
